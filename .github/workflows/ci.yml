name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [build, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Linux amd64
      run: GOOS=linux GOARCH=amd64 go build -o bin/xxldb-linux-amd64 ./cmd/xxldb

    - name: Build Linux arm64
      run: GOOS=linux GOARCH=arm64 go build -o bin/xxldb-linux-arm64 ./cmd/xxldb

    - name: Build Windows amd64
      run: GOOS=windows GOARCH=amd64 go build -o bin/xxldb-windows-amd64.exe ./cmd/xxldb

    - name: Build macOS amd64
      run: GOOS=darwin GOARCH=amd64 go build -o bin/xxldb-darwin-amd64 ./cmd/xxldb

    - name: Build macOS arm64
      run: GOOS=darwin GOARCH=arm64 go build -o bin/xxldb-darwin-arm64 ./cmd/xxldb

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: bin/
